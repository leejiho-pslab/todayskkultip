name: 위성 콘텐츠 부스트 (애드센스 승인용)

# kkultip·jype 프로필 글이 목표(기본 45편)에 못 미치면 매일 소량(기본 2편/일)씩
# 고품질(sonnet)로 생성해 채운다 — "가치가 별로 없는 콘텐츠" 반려 대응.
# 생성된 글은 push → sync-sites 가 위성 레포로 전달한다.
# 2026-08-19 변경: 목표 30 도달 후 부스트가 멈추자 사이트가 11일간 정체된 상태로
# 심사받아 jype 가 반려됨 → 목표 45 + 하루 2편의 "꾸준한 성장" 모드로 전환
# (심사에는 총량만큼 지속 업데이트 이력이 중요). 하루에 수십 편 쏟아지는 것은 금물.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "프로필당 목표 글 수"
        default: "45"
      per_run:
        description: "이번 실행 프로필당 최대 생성 수"
        default: "2"
  schedule:
    - cron: "30 1 * * *" # 매일 10:30 KST — 목표 도달 시 자동 스킵

permissions:
  contents: write
  actions: write # 커밋 후 sync-sites 디스패치용 (봇 푸시는 push 트리거를 못 깨움)

concurrency:
  group: "content-boost"
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Chrome 설치 (커버 이미지용 — 실패해도 계속)
        id: setupchrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 이미지 폰트 준비
        continue-on-error: true
        run: npm i --no-save pretendard

      - name: 프로필별 부족분 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHROME_BIN: ${{ steps.setupchrome.outputs.chrome-path }}
          # 승인 심사용 콘텐츠는 품질 우선 — 본문만 sonnet (일일 정규 발행은 haiku 유지)
          CONTENT_MODEL: claude-sonnet-4-6
          # 시장조사 스코프는 default 니치 기준이라 위성 주제와 안 맞음 → 제한 해제
          RESEARCH_ONLY: "false"
          TARGET: ${{ github.event.inputs.target || '45' }}
          PER_RUN: ${{ github.event.inputs.per_run || '2' }}
        shell: bash {0}
        run: |
          for P in kkultip jype; do
            N=$(SITE_PROFILE=$P node -e 'import("./automation/lib.mjs").then(m=>console.log(m.loadPosts().length))')
            DEFICIT=$(( TARGET - N ))
            if [ "$DEFICIT" -le 0 ]; then
              echo "[$P] ${N}편 — 목표(${TARGET}) 도달, 건너뜀"
              continue
            fi
            GEN=$(( DEFICIT < PER_RUN ? DEFICIT : PER_RUN ))
            echo "[$P] 현재 ${N}편 → ${GEN}편 생성 (목표 ${TARGET})"
            SITE_PROFILE=$P node automation/generate.mjs "$GEN" || echo "[$P] ⚠ 일부 실패 — 다음 실행에서 재시도"
          done

      - name: 생성 글 커밋·푸시
        id: commitpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in content/posts src/assets/covers config/topics; do
            git add "$p" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: 위성 콘텐츠 부스트 ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "커밋할 신규 글 없음"
          fi

      # 봇(GITHUB_TOKEN) 푸시는 push 트리거 워크플로를 깨우지 못한다 —
      # 새 글이 커밋됐으면 위성 레포 동기화를 명시적으로 디스패치 (과거 사고: 8/8~8/10
      # 부스트 글이 위성 사이트에 전달되지 않음)
      - name: 위성 동기화 디스패치
        if: steps.commitpush.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-sites.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" || echo "디스패치 실패(다음 push 때 동기화됨)"
