name: 네이버 원고 일괄 생성 (수동)

# 운영자가 네이버 발행분을 미리 쌓아두고 싶을 때 수동 실행하는 일회성 배치.
# 최신 N편(연예 제외)의 네이버 전용 고유 원고(재작성)+상품 추천+이미지(n1/n2 카드)를
# 한 번에 생성해 커밋한다. n0 실사 히어로는 힉스필드 제작본이 이미 커밋돼 있으면 존중됨.
# 정기 크론의 REWRITE=false(0원 스위치)와 무관 — 이 워크플로는 운영자가 눌렀을 때만 비용 발생.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "네이버 원고를 만들 최신 글 수 (연예 제외)"
        default: "10"
      generate:
        description: "먼저 새 글을 이만큼 생성 (0=기존 글만, 신규 주제로 사이트·전 채널에도 발행됨)"
        default: "0"

permissions:
  contents: write
  actions: write # 커밋 후 publish/sync 디스패치용 (봇 푸시는 push 트리거를 못 깨움)

concurrency:
  group: "naver-batch"
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Chrome 설치 (카드 이미지 렌더용)
        id: setupchrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 이미지 폰트 준비
        continue-on-error: true
        run: npm i --no-save pretendard

      - name: 신규 글 생성 (generate 입력 > 0 일 때만 — 운영자 명시 요청 배치)
        if: ${{ (github.event.inputs.generate || '0') != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHROME_BIN: ${{ steps.setupchrome.outputs.chrome-path }}
          # 네이버·사이트 동시 게시용 신규 글은 품질 우선(승인 심사에도 반영됨)
          CONTENT_MODEL: claude-sonnet-4-6
          # 채널 플래그가 생성 시점 env 로 결정되므로 정규 발행(publish.yml)과 동일하게 제공
          # (과거 사고: 이 env 누락으로 배치 생성 글이 wordpress:false 로 구워짐)
          WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: node automation/generate.mjs "${{ github.event.inputs.generate }}"

      - name: 네이버 고유 원고 재작성 (최신 N편)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REWRITE_NAVER_LIMIT: ${{ github.event.inputs.count || '10' }}
          # 블로거/워드프레스 임박분은 정기 크론이 담당 — 이 배치는 네이버만
          PUBLISH_LIMIT: "0"
        run: node automation/rewrite.mjs

      - name: 네이버 이미지 세트 보장 (외부 실사 존중 + 부족분 카드 렌더)
        env:
          CHROME_BIN: ${{ steps.setupchrome.outputs.chrome-path }}
          REWRITE_NAVER_LIMIT: ${{ github.event.inputs.count || '10' }}
        run: node automation/naver-images.mjs

      - name: 커밋·푸시 (푸시가 사이트 빌드를 트리거 → 대시보드 갱신)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # requests.json 도 포함 — generate 가 처리한 요청을 done 으로 표시한 변경까지 커밋해야
          # 다음 실행에서 같은 주제가 중복 생성되지 않는다
          for p in content/posts src/assets/covers config/topics config/requests.json content/variants src/assets/naver; do
            git add "$p" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: 네이버 원고 일괄 생성 (${{ github.event.inputs.count || '10' }}편)"
            # autostash: 실행 중 남은 미스테이징 변경이 있어도 리베이스가 막히지 않게
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "커밋할 변경 없음"
          fi
        id: commitpush

      # 봇 푸시는 push 트리거를 깨우지 못함 — 커밋이 있었으면 사이트 재빌드(대시보드 갱신)와
      # 위성 동기화를 명시적으로 디스패치
      - name: 재빌드·동기화 디스패치
        if: steps.commitpush.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" || echo "publish 디스패치 실패"
          gh workflow run sync-sites.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" || echo "sync 디스패치 실패"
